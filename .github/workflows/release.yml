# Push a tag like v1.2.0 -> builds pronouns.zip and publishes a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version (tag = info.json = config.lua)
        run: |
          tag="${GITHUB_REF_NAME#v}"
          info=$(jq -r .version info.json)
          lua=$(sed -n 's/^local VERSION = "\([^"]*\)".*/\1/p' config.lua)
          if [ "$tag" != "$info" ] || [ "$tag" != "$lua" ]; then
            echo "::error::version mismatch: tag $tag, info.json $info, config.lua $lua"
            exit 1
          fi

      - name: Syntax check
        run: |
          sudo apt-get install -y -qq lua5.4
          for f in *.lua; do luac5.4 -p "$f"; done

      - name: Build zip
        run: |
          mkdir -p dist/pronouns
          cp *.lua info.json LICENSE README.md dist/pronouns/
          cd dist && zip -r "chatterino-pronouns-${GITHUB_REF_NAME}.zip" pronouns

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/chatterino-pronouns-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" --generate-notes
